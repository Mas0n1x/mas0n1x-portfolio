<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#2133ff">
  <title>Wartung – Mas0n1x</title>
  <link rel="icon" href="/logo.png">
  <link href="/fonts/fonts.css" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{height:100%}
    body{background:#2133ff;color:#f5f6ff;font-family:'IBM Plex Sans',system-ui,sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased;overflow:hidden}
    canvas{position:fixed;inset:0;width:100%;height:100%}
    main{position:relative;z-index:1;min-height:100%;display:flex;flex-direction:column;justify-content:center;padding:max(32px,env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-right,0px)) max(32px,env(safe-area-inset-bottom,0px)) max(24px,env(safe-area-inset-left,0px));max-width:1200px;margin:0 auto}
    .status{display:inline-flex;align-items:center;gap:10px;font-size:.95rem;color:rgba(245,246,255,.75);margin-bottom:28px}
    .dot{width:9px;height:9px;border-radius:50%;background:#ffd166;animation:ping 2.2s ease-out infinite}
    @keyframes ping{0%{box-shadow:0 0 0 0 rgba(255,209,102,.55)}70%,100%{box-shadow:0 0 0 11px rgba(255,209,102,0)}}
    h1{font-family:'Archivo',sans-serif;font-weight:800;font-stretch:114%;font-size:clamp(3rem,11vw,9.5rem);line-height:.92;letter-spacing:-.045em}
    .message{font-size:1.15rem;color:rgba(245,246,255,.78);max-width:44ch;margin-top:32px}
    .custom-message{margin-top:20px;padding:16px 20px;border:1px solid rgba(245,246,255,.3);border-radius:14px;max-width:52ch;color:#f5f6ff}
    .contact{margin-top:40px;font-size:1rem;color:rgba(245,246,255,.75)}
    .contact a{color:#f5f6ff;border-bottom:1.5px solid rgba(245,246,255,.4);padding-bottom:2px}
    .contact a:hover{border-color:#f5f6ff}
    :focus-visible{outline:2px solid #f5f6ff;outline-offset:3px}
    @media(prefers-reduced-motion:reduce){.dot{animation:none}}
  </style>
</head>
<body>
  <canvas id="c" aria-hidden="true"></canvas>
  <main>
    <span class="status"><span class="dot" aria-hidden="true"></span>Wartungsarbeiten</span>
    <h1>Gleich wieder da.</h1>
    <p class="message">Ich arbeite gerade an Verbesserungen. Schau in ein paar Minuten noch einmal vorbei.</p>
    <div id="custom-message" class="custom-message" style="display:none"></div>
    <p class="contact">Dringend? Schreib mir an <a href="mailto:support@mas0n1x.online">support@mas0n1x.online</a></p>
  </main>
  <script>
    fetch('/api/maintenance').then(r=>r.json()).then(d=>{if(d.message){const m=document.getElementById('custom-message');m.textContent=d.message;m.style.display='block';}}).catch(()=>{});
    // Höhenlinien, die langsam fließen
    (function(){
      const cv=document.getElementById('c'),ctx=cv.getContext('2d'),rm=matchMedia('(prefers-reduced-motion: reduce)').matches;let W,H,dpr;
      function size(){dpr=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);draw(0);}
      function draw(t){ctx.clearRect(0,0,W,H);ctx.strokeStyle='rgba(245,246,255,.14)';ctx.lineWidth=1;const gap=22,L=Math.ceil(H/gap);
        for(let i=0;i<L;i++){const y0=(i+.5)*gap;ctx.beginPath();for(let x=0;x<=W+14;x+=14){const y=y0+Math.sin(x*.0048+t*.0003+i*.26)*10+Math.sin(x*.011-t*.00036+i*.15)*4;x?ctx.lineTo(x,y):ctx.moveTo(x,y);}ctx.stroke();}}
      function loop(t){draw(t);requestAnimationFrame(loop);}
      addEventListener('resize',size);size();if(!rm)requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
