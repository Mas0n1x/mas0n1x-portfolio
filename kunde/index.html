  <!-- Login Screen -->
  <div id="login-screen" class="login-screen">
    <div class="login-container">
      <div class="login-logo">
        <img src="/logo.png" alt="Logo">
      </div>
      <h1>Kundenportal</h1>
      <form id="login-form">
        <div class="form-group">
          <label for="email">E-Mail</label>
          <input type="email" id="email" placeholder="ihre@email.de" required>
        </div>
        <div class="form-group">
          <label for="password">Passwort</label>
          <input type="password" id="password" placeholder="Ihr Passwort" required>
        </div>
        <button type="submit" class="btn-primary">
          <svg class="ic"><use href="#fa-sign-in-alt"></use></svg> Anmelden
        </button>
        <p id="login-error" class="error-message"></p>
      </form>
      <div class="login-footer">
        <p>Noch kein Konto? <a href="/projekt-starten.html">Projekt starten</a></p>
      </div>
    </div>
  </div>

  <!-- Dashboard -->
  <div id="dashboard" class="dashboard hidden">
    <header class="header">
      <div class="header-left">
        <img src="/logo.png" alt="Logo" class="header-logo">
        <span>Kundenportal</span>
      </div>
      <div class="header-right">
        <span id="user-email"></span>
        <button id="logout-btn" class="btn-icon">
          <svg class="ic"><use href="#fa-sign-out-alt"></use></svg>
        </button>
      </div>
    </header>

    <!-- Navigation Tabs -->
    <nav class="portal-nav">
      <button class="portal-tab active" data-view="requests">
        <svg class="ic"><use href="#fa-folder-open"></use></svg> Meine Anfragen
      </button>
      <button class="portal-tab" data-view="appointments">
        <svg class="ic"><use href="#fa-calendar-alt"></use></svg> Termine
      </button>
      <button class="portal-tab" data-view="invoices">
        <svg class="ic"><use href="#fa-file-invoice"></use></svg> Rechnungen
      </button>
      <button class="portal-tab" data-view="faq">
        <svg class="ic"><use href="#fa-question-circle"></use></svg> FAQ
      </button>
    </nav>

    <main class="main-content">
      <!-- Requests List View -->
      <div id="requests-view" class="portal-view">
        <div class="page-header">
          <h1><svg class="ic"><use href="#fa-folder-open"></use></svg> Meine Anfragen</h1>
          <a href="/projekt-starten.html" class="btn-primary">
            <svg class="ic"><use href="#fa-plus"></use></svg> Neues Projekt
          </a>
        </div>

        <div id="requests-list" class="requests-list">
          <!-- Loaded dynamically -->
        </div>
      </div>

      <!-- Appointments View -->
      <div id="appointments-view" class="portal-view hidden">
        <div class="page-header">
          <h1><svg class="ic"><use href="#fa-calendar-alt"></use></svg> Terminbuchung</h1>
        </div>

        <div class="appointments-container">
          <div class="appointment-booking">
            <h2><svg class="ic"><use href="#fa-calendar-plus"></use></svg> Neuen Termin buchen</h2>
            <div class="booking-form">
              <div class="form-group">
                <label for="appointment-date">Datum</label>
                <input type="date" id="appointment-date" min="">
              </div>
              <div class="form-group">
                <label>Verfügbare Uhrzeiten</label>
                <div id="time-slots" class="time-slots">
                  <p class="text-muted">Wähle zuerst ein Datum</p>
                </div>
              </div>
              <div class="form-group">
                <label for="appointment-type">Art des Termins</label>
                <select id="appointment-type">
                  <option value="consultation">Beratungsgespräch</option>
                  <option value="project-discussion">Projektbesprechung</option>
                  <option value="support">Support</option>
                  <option value="other">Sonstiges</option>
                </select>
              </div>
              <div class="form-group">
                <label for="appointment-notes">Anmerkungen (optional)</label>
                <textarea id="appointment-notes" rows="3" placeholder="Worum geht es?"></textarea>
              </div>
              <button id="book-appointment-btn" class="btn-primary" onclick="bookAppointment()" disabled>
                <svg class="ic"><use href="#fa-calendar-check"></use></svg> Termin buchen
              </button>
            </div>
          </div>

          <div class="my-appointments">
            <h2><svg class="ic"><use href="#fa-list"></use></svg> Meine Termine</h2>
            <div id="my-appointments-list" class="appointments-list">
              <!-- Loaded dynamically -->
            </div>
          </div>
        </div>
      </div>

      <!-- Rechnungen View -->
      <div id="invoices-view" class="portal-view hidden">
        <div class="page-header">
          <h1><svg class="ic"><use href="#fa-file-invoice"></use></svg> Meine Rechnungen</h1>
        </div>
        <div id="invoices-list" class="inv-list"></div>
      </div>

      <!-- FAQ View -->
      <div id="faq-view" class="portal-view hidden">
        <div class="page-header">
          <h1><svg class="ic"><use href="#fa-question-circle"></use></svg> Häufig gestellte Fragen</h1>
        </div>

        <div id="faq-list" class="faq-list">
          <!-- Loaded dynamically -->
        </div>
      </div>

      <!-- Request Detail View -->
      <div id="request-detail-view" class="hidden">
        <div class="page-header">
          <button id="back-btn" class="btn-secondary">
            <svg class="ic"><use href="#fa-arrow-left"></use></svg> Zurück
          </button>
          <h1 id="detail-title"><svg class="ic"><use href="#fa-file-alt"></use></svg> Anfrage Details</h1>
        </div>

        <div class="detail-container">
          <div class="detail-sidebar">
            <div id="request-info" class="info-card">
              <!-- Loaded dynamically -->
            </div>

            <!-- Dokumente Section -->
            <div class="documents-card">
              <div class="documents-header">
                <h3><svg class="ic"><use href="#fa-file-alt"></use></svg> Dokumente</h3>
              </div>
              <div id="documents-list" class="documents-list">
                <!-- Loaded dynamically -->
              </div>
            </div>

          </div>

          <div class="chat-container">
            <div class="chat-header">
              <h3><svg class="ic"><use href="#fa-comments"></use></svg> Kommunikation</h3>
            </div>
            <div id="chat-messages" class="chat-messages">
              <!-- Loaded dynamically -->
            </div>
            <div class="chat-input-area">
              <div class="chat-input-wrapper">
                <textarea id="message-input" placeholder="Nachricht schreiben..." rows="2"></textarea>
                <label class="file-btn">
                  <input type="file" id="file-input" hidden>
                  <svg class="ic"><use href="#fa-paperclip"></use></svg>
                </label>
              </div>
              <span id="file-name" class="file-name"></span>
              <button id="send-btn" class="btn-primary">
                <svg class="ic"><use href="#fa-paper-plane"></use></svg> Senden
              </button>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Rechnung Detail/Druck -->
  <div id="invoice-modal" class="iv-modal">
    <div class="iv-overlay" onclick="closeInvoice()"></div>
    <div class="iv-box">
      <div class="iv-actions no-print">
        <button class="btn-primary" onclick="printInvoice()"><svg class="ic"><use href="#fa-print"></use></svg> Drucken / Als PDF</button>
        <a id="invoice-pay" class="btn-primary pay" href="#" target="_blank" rel="noopener" style="display:none"><svg class="ic"><use href="#fa-credit-card"></use></svg> Jetzt bezahlen</a>
        <button class="btn-secondary" onclick="closeInvoice()">Schließen</button>
      </div>
      <div id="invoice-body"></div>
    </div>
  </div>

  <script src="js/kunde.js?v=7"></script>
</body>
</html>
